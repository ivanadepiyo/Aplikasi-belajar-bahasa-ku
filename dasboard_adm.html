const data={

["DS","Dewi Sari","dewi@email.com","Jepang","Pending","2 Hari"],
["AM","Andi Maulana","andi@email.com","Inggris","Aktif","31 Hari"]
],
languages:[["🇯🇵","Bahasa Jepang","1.240","75%"],["🇬🇧","Bahasa Inggris","3.420","82%"],["🇰🇷","Bahasa Korea","980","64%"],["🇨🇳","Bahasa Mandarin","760","58%"],["🇩🇪","Bahasa Jerman","420","51%"],["🇫🇷","Bahasa Prancis","510","47%"]],

const pages={
dashboard:{title:"Dashboard Admin",render:dashboard},
users:{title:"Manajemen Pengguna",render:users},
languages:{title:"Manajemen Bahasa",render:languages},
levels:{title:"Manajemen Level",render:levels},
courses:{title:"Manajemen Kursus",render:courses},
materials:{title:"Manajemen Materi",render:materials},
practice:{title:"Manajemen Latihan",render:simpleTable("Latihan",["Nama Latihan","Kategori","Soal","Status"],["Kosakata Dasar","Kosakata","20","Aktif"],["Grammar N5","Grammar","30","Aktif"],["Percakapan Sehari-hari","Speaking","20","Aktif"],["TOEFL Listening","Listening","40","Draft"])},
quiz:{title:"Manajemen Quiz",render:simpleTable("Quiz",["Judul","Bahasa","Jumlah Soal","Kesulitan"],["Kosakata Dasar","Jepang","20","Mudah"],["Grammar N5","Jepang","30","Menengah"],["Daily Conversation","Inggris","25","Menengah"])},
listening:{title:"Manajemen Listening",render:simpleTable("Listening",["Materi","Bahasa","Durasi","Status"],["Percakapan Restoran","Jepang","02:45","Aktif"],["Daily Conversation","Inggris","03:10","Aktif"],["TOPIK Listening","Korea","04:20","Draft"])},
speaking:{title:"Manajemen Speaking",render:simpleTable("Speaking",["Materi","Bahasa","Penilaian","Status"],["Perkenalan Diri","Jepang","AI Score","Aktif"],["Daily Talk","Inggris","AI Score","Aktif"])},
achievement:{title:"Manajemen Achievement",render:simpleTable("Achievement",["Badge","Target","Peraih","Status"],["🏅 Pemula","7 Hari","420","Aktif"],["🔥 Konsisten","30 Hari","186","Aktif"],["🌟 Master","50 Jam","72","Aktif"],["🎯 Mahir","Level 18","45","Aktif"])},
certificate:{title:"Manajemen Sertifikat",render:simpleTable("Sertifikat",["Nama","Kursus","Tanggal","Status"],["Ayah Premium","Bahasa Jepang - Dasar","01/09/2026","Terbit"],["Budi Santoso","Inggris Beginner","31/08/2026","Terbit"])},
community:{title:"Manajemen Community",render:simpleTable("Community",["Pengguna","Postingan","Komentar","Status"],["Santoso_90","Belajar bahasa Jepang","12","Aktif"],["Rina_88","Tips listening JLPT","8","Aktif"],["DwiPutri","Belajar bersama","21","Ditinjau"])},

function stat(title,value,icon,delta="+12%"){return `<div class="card stat"><div class="icon">${icon}</div><small>${title}</small><strong>${value}</strong><span class="delta">${delta} dari bulan lalu</span></div>`}
function dashboard(){return `<div class="hero"><div><h2>Selamat Datang, Admin 👋</h2><p>Pantau aktivitas aplikasi AKU BISA dan kelola seluruh konten pembelajaran dari satu tempat.</p></div><div class="hero-art">📊</div></div><div class="stats">${stat("Total Pengguna","1.240","♙","+8,4%")}${stat("Pengguna Aktif","860","◉","+12,1%")}${stat("Kursus","50","▣","+5,0%")}${stat("Total Poin","4.250","★","+16,2%")}</div><div class="dashboard-grid"><div class="card"><div class="section-head"><h3>Aktivitas Pengguna</h3><button class="btn light" onclick="go('reports')">Lihat Laporan</button></div><div class="chart">${[44,66,52,82,60,92,73].map((v,i)=>`<div class="bar-wrap"><div><div class="bar" style="height:${v*1.7}px"></div><div class="bar-label">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"][i]}</div></div><div><div class="bar alt" style="height:${v*1.1}px"></div></div></div>`).join("")}</div></div><div class="card"><div class="section-head"><h3>Distribusi Bahasa</h3></div><div class="donut"></div><div class="legend"><span>Jepang 39%</span><span>Inggris 23%</span><span>Korea 18%</span><span>Lainnya 20%</span></div></div></div><div class="section-head"><h3>Pengguna Terbaru</h3><button class="btn" onclick="go('users')">Kelola Pengguna</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Pengguna</th><th>Bahasa</th><th>Status</th><th>Aktivitas</th><th>Aksi</th></tr></thead><tbody>${data.users.slice(0,4).map(userRow).join("")}</tbody></table></div>`}
function userRow(u){return `<tr><td><div class="user-cell"><div class="mini">${u[0]}</div><div><b>${u[1]}</b><br><small>${u[2]}</small></div></div></td><td>${u[3]}</td><td><span class="status ${u[4]==="Aktif"?"active":"pending"}">${u[4]}</span></td><td>${u[5]}</td><td><button class="btn light" onclick="viewUser('${u[1]}')">Detail</button></td></tr>`}
function users(){return `<div class="page-toolbar"><input class="search" id="userSearch" placeholder="Cari nama atau email..." oninput="filterUsers()"><select class="filter" id="userFilter" onchange="filterUsers()"><option>Semua Status</option><option>Aktif</option><option>Pending</option></select><button class="btn" onclick="openAddUser()">+ Tambah Pengguna</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Pengguna</th><th>Bahasa</th><th>Status</th><th>Streak</th><th>Aksi</th></tr></thead><tbody id="userRows">${data.users.map(userRow).join("")}</tbody></table></div>`}
function languages(){return `<div class="page-toolbar"><input class="search" placeholder="Cari bahasa..." oninput="filterCards(this.value)"><button class="btn" onclick="openLanguage()">+ Tambah Bahasa</button></div><div class="grid3" id="languageGrid">${data.languages.map(x=>`<div class="card course-card filter-item" data-name="${x[1].toLowerCase()}"><div class="cover">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]} pengguna</p><div class="progress"><span style="width:${x[3]}"></span></div><small>Rata-rata penyelesaian ${x[3]}</small><br><button class="btn light" style="margin-top:10px" onclick="toast('Bahasa ${x[1]} dibuka')">Kelola</button></div>`).join("")}</div>`}
function levels(){return `<div class="page-toolbar"><button class="btn" onclick="openLevel()">+ Tambah Level</button></div><div class="card"><table class="table"><thead><tr><th>Level</th><th>Nama</th><th>Target Poin</th><th>Pengguna</th><th>Status</th></tr></thead><tbody>${[["1","Pemula","0","410"],["5","Dasar","500","280"],["10","Menengah","1.500","190"],["15","Lanjutan","3.000","95"],["18","Mahir","4.000","45"]].map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td><td>${x[3]}</td><td><span class="status active">Aktif</span></td></tr>`).join("")}</tbody></table></div>`}
function courses(){return `<div class="page-toolbar"><input class="search" placeholder="Cari kursus..." oninput="filterCards(this.value)"><button class="btn" onclick="openCourse()">+ Tambah Kursus</button></div><div class="grid3">${data.courses.map(x=>`<div class="card course-card filter-item" data-name="${x[1].toLowerCase()}"><div class="cover">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]} peserta</p><div class="progress"><span style="width:${x[3]}"></span></div><small>Progress rata-rata ${x[3]}</small><div style="margin-top:12px"><button class="btn light" onclick="toast('Kursus dikelola')">Kelola</button></div></div>`).join("")}</div>`}
function materials(){return `<div class="page-toolbar"><input class="search" placeholder="Cari materi..."><button class="btn" onclick="openMaterial()">+ Tambah Materi</button></div>${simpleTable("Daftar Materi",["Materi","Kursus","Jenis","Status"],["Pengenalan Diri","Jepang - Dasar","Video + PDF","Aktif"],["Kosakata N5","Jepang - Dasar","Kartu","Aktif"],["Grammar Dasar","Inggris Beginner","Video","Aktif"],["Listening Restaurant","Jepang - Dasar","Audio","Draft"])()}`}
function simpleTable(title,headers,...rows){return ()=>`<div class="page-toolbar"><input class="search" placeholder="Cari ${title.toLowerCase()}..."><button class="btn" onclick="openGeneric('${title}')">+ Tambah ${title}</button></div><div class="card table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}<th>Aksi</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?`<span class="status ${v==="Aktif"||v==="Terbit"?"active":v==="Draft"||v==="Ditinjau"?"pending":"active"}">${v}</span>`:v}</td>`).join("")}<td><button class="btn light" onclick="toast('Data diedit')">Edit</button></td></tr>`).join("")}</tbody></table></div>`}
function premium(){return `<div class="stats">${stat("Member Premium","240","♛","+18%")}${stat("Pendapatan","Rp18,4 Jt","▣","+12%")}${stat("Konversi","19,4%","↗","+3,2%")}${stat("Renewal","82%","✓","+4,1%")}</div><div class="grid3"><div class="card"><h3>12 Bulan</h3><h2>Rp299.000</h2><p class="muted">185 pelanggan</p><button class="btn" onclick="openGeneric('Paket Premium')">Kelola</button></div><div class="card"><h3>18 Bulan</h3><h2>Rp59.000</h2><p class="muted">55 pelanggan</p><button class="btn" onclick="openGeneric('Paket Premium')">Kelola</button></div></div>`}
function broadcast(){return `<div class="card form-grid"><div class="field"><label>Judul Notifikasi</label><input placeholder="Contoh: Materi baru tersedia"></div><div class="field"><label>Target</label><select><option>Semua Pengguna</option><option>Member Premium</option><option>Bahasa Jepang</option></select></div><div class="field full"><label>Pesan</label><textarea placeholder="Tulis pesan pemberitahuan..."></textarea></div><div class="full"><button class="btn" onclick="toast('Notifikasi berhasil dijadwalkan')">Kirim Pemberitahuan</button></div></div>`}
function reports(){return `<div class="stats">${stat("DAU","860","◉","+12%")}${stat("MAU","1.090","◉","+9%")}${stat("Completion","68%","✓","+5%")}${stat("Retensi","74%","↗","+4%")}</div><div class="card"><div class="section-head"><h3>Ringkasan Analitik</h3><button class="btn light" onclick="toast('Laporan CSV dibuat')">Export CSV</button></div><div class="metric-list">${["Pengguna baru minggu ini|184","Kursus paling populer|Bahasa Jepang - Dasar","Latihan selesai|5.060","Quiz selesai|3.840","Jam belajar|1.280 jam","Sertifikat diterbitkan|328"].map(x=>{let a=x.split("|");return `<div class="metric"><b>${a[0]}</b><span>${a[1]}</span></div>`}).join("")}</div></div>`}
function go(page){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("pageTitle").textContent=pages[page].title;document.getElementById("content").innerHTML=pages[page].render();document.getElementById("sidebar").classList.remove("open");window.scrollTo(0,0)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.timer);window.timer=setTimeout(()=>t.style.display="none",2200)}
function openModal(title,body){document.getElementById("modalContent").innerHTML=`<h2 style="margin-top:0">${title}</h2>${body}`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function viewUser(n){openModal("Detail Pengguna",`<p><b>${n}</b></p><p class="muted">Aktivitas, kursus, progress, poin, sertifikat, dan riwayat belajar.</p><button class="btn" onclick="closeModal()">Tutup</button>`)}
function openAddUser(){openModal("Tambah Pengguna",`<div class="form-grid"><div class="field"><label>Nama</label><input id="newName"></div><div class="field"><label>Email</label><input id="newEmail"></div><div class="field full"><button class="btn" onclick="addUser()">Simpan Pengguna</button></div></div>`)}
function addUser(){let n=document.getElementById("newName").value||"Pengguna Baru",e=document.getElementById("newEmail").value||"email@email.com";data.users.unshift(["NB",n,e,"Jepang","Aktif","0 Hari"]);closeModal();go("users");toast("Pengguna berhasil ditambahkan ✓")}
function openLanguage(){openGeneric("Bahasa")}
function openLevel(){openGeneric("Level")}
function openCourse(){openGeneric("Kursus")}
function openMaterial(){openGeneric("Materi")}
function openGeneric(title){openModal("Tambah "+title,`<div class="form-grid"><div class="field"><label>Nama</label><input placeholder="Nama ${title}"></div><div class="field"><label>Status</label><select><option>Aktif</option><option>Draft</option></select></div><div class="field full"><label>Deskripsi</label><textarea placeholder="Deskripsi..."></textarea></div><div class="full"><button class="btn" onclick="closeModal();toast('${title} berhasil disimpan ✓')">Simpan</button></div></div>`)}
function filterCards(q){q=q.toLowerCase();document.querySelectorAll(".filter-item").forEach(x=>x.style.display=x.dataset.name.includes(q)?"block":"none")}
function filterUsers(){let q=document.getElementById("userSearch").value.toLowerCase(),f=document.getElementById("userFilter").value;document.querySelectorAll("#userRows tr").forEach((tr,i)=>{let u=data.users[i];tr.style.display=((u[1]+u[2]).toLowerCase().includes(q)&&(f==="Semua Status"||u[4]===f))?"table-row":"none"})}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("searchBtn").onclick=()=>toast("Pencarian admin siap digunakan");
document.getElementById("notifyBtn").onclick=()=>toast("3 notifikasi baru");
document.getElementById("dateText").textContent=new Intl.DateTimeFormat("id-ID",{dateStyle:"full"}).format(new Date());
go("dashboard");
