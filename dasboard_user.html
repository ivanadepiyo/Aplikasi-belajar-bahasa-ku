<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f7fb;

    color: #172033;

    font-size: 14px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 235px;

    background:
        linear-gradient(
            180deg,
            #1464cb,
            #0a438f
        );

    color: white;

    padding: 17px 12px;

    overflow-y: auto;

    z-index: 100;
}


/* BRAND */

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 5px 7px 18px;
}


.brand-logo {

    width: 36px;
    height: 36px;

    border-radius: 10px;

    background: white;

    color: #1260c4;

    display: grid;

    place-items: center;

    font-size: 20px;

    font-weight: bold;
}


.brand h2 {

    font-size: 14px;

    margin-bottom: 3px;
}


.brand span {

    font-size: 7px;

    color: #d7e7ff;
}


/* =====================================================
   USER MINI PROFILE
===================================================== */

.user-mini {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 11px;

    margin-bottom: 14px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 11px;
}


.avatar {

    width: 37px;
    height: 37px;

    border-radius: 50%;

    background: #edf4ff;

    color: #1260c4;

    display: grid;

    place-items: center;

    font-weight: 800;

    font-size: 10px;
}


.user-mini strong {

    display: block;

    font-size: 10px;
}


.user-mini small {

    display: block;

    margin-top: 3px;

    font-size: 8px;

    color: #d6e6ff;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {

    display: flex;

    flex-direction: column;

    gap: 3px;
}


.nav-item {

    width: 100%;

    border: none;

    background: transparent;

    color: #dceaff;

    padding: 9px 10px;

    border-radius: 8px;

    text-align: left;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 11px;

    font-size: 10px;

    transition: .2s;
}


.nav-item span {

    width: 17px;

    text-align: center;
}


.nav-item:hover {

    background: rgba(255,255,255,.12);

    color: white;
}


.nav-item.active {

    background: white;

    color: #1260c4;

    font-weight: 700;
}


/* SUPPORT */

.support-button {

    width: 100%;

    margin-top: 18px;

    padding: 13px 7px;

    background: transparent;

    color: #dceaff;

    border: none;

    border-top: 1px solid rgba(255,255,255,.15);

    text-align: left;

    font-size: 9px;

    cursor: pointer;
}


/* =====================================================
   MAIN
===================================================== */

.main-content {

    margin-left: 235px;

    min-height: 100vh;

    padding: 0 28px 40px;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

    height: 68px;

    border-bottom: 1px solid #e4e8ef;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.search-box {

    width: 390px;

    height: 38px;

    background: white;

    border: 1px solid #dfe4ec;

    border-radius: 10px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 0 11px;

    color: #8c96a7;
}


.search-box input {

    width: 100%;

    border: none;

    outline: none;

    font-size: 11px;
}


.top-actions {

    display: flex;

    align-items: center;

    gap: 8px;
}


.top-button {

    width: 37px;
    height: 37px;

    border: 1px solid #e0e5ed;

    background: white;

    border-radius: 9px;

    cursor: pointer;

    position: relative;
}


.top-button i {

    position: absolute;

    width: 7px;
    height: 7px;

    background: #ed5a70;

    border-radius: 50%;

    right: 7px;
    top: 6px;
}


.top-user {

    display: flex;

    align-items: center;

    gap: 8px;
}


.top-user strong {

    display: block;

    font-size: 10px;
}


.top-user small {

    display: block;

    font-size: 8px;

    color: #8a94a5;

    margin-top: 3px;
}


.avatar.small {

    width: 32px;
    height: 32px;
}


.mobile-menu {

    display: none;

    border: none;

    background: white;

    padding: 9px;

    border-radius: 8px;

    cursor: pointer;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    padding-top: 24px;
}


.welcome {

    display: flex;

    justify-content: space-between;

    align-items: end;

    margin-bottom: 18px;
}


.eyebrow {

    color: #1461c2;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: .5px;
}


.welcome h1 {

    font-size: 24px;

    margin: 6px 0;
}


.muted {

    color: #8993a5;

    font-size: 10px;
}


.date {

    background: white;

    border: 1px solid #e1e6ee;

    padding: 8px 11px;

    border-radius: 9px;

    font-size: 9px;
}


/* =====================================================
   STATISTICS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 13px;

    margin-bottom: 20px;
}


.stat {

    background: white;

    border: 1px solid #e1e6ee;

    border-radius: 13px;

    padding: 15px;

    position: relative;
}


.stat small {

    color: #7f899a;

    font-size: 9px;
}


.stat strong {

    display: block;

    font-size: 22px;

    margin: 8px 0 5px;
}


.stat label {

    color: #299b68;

    font-size: 8px;
}


.stat-icon {

    position: absolute;

    right: 13px;
    top: 13px;

    width: 31px;
    height: 31px;

    background: #edf4ff;

    color: #1461c2;

    border-radius: 9px;

    display: grid;

    place-items: center;
}


/* =====================================================
   GRID
===================================================== */

.dashboard-grid {

    display: grid;

    grid-template-columns:
        minmax(0,2fr)
        minmax(280px,.9fr);

    gap: 16px;
}


/* =====================================================
   PANEL
===================================================== */

.panel {

    background: white;

    border: 1px solid #e1e6ee;

    border-radius: 13px;

    padding: 18px;
}


.section-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;
}


.section-title h2 {

    font-size: 13px;
}


.section-title p {

    margin-top: 4px;

    color: #8993a5;

    font-size: 9px;
}


.link-button {

    background: none;

    border: none;

    color: #1764c2;

    font-size: 9px;

    cursor: pointer;
}


/* =====================================================
   COURSE
===================================================== */

.course {

    display: grid;

    grid-template-columns: 210px 1fr;

    overflow: hidden;

    padding: 0;

    margin-bottom: 20px;
}


.course-cover {

    min-height: 190px;

    background:
        linear-gradient(
            135deg,
            #f4dddd,
            #dcecff
        );

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 6px;
}


.course-cover .flag {

    font-size: 58px;
}


.course-cover small {

    font-size: 8px;

    font-weight: 800;
}


.course-content {

    padding: 18px;
}


.badge {

    display: inline-block;

    padding: 5px 8px;

    border-radius: 20px;

    background: #e7f6ef;

    color: #168258;

    font-size: 7px;

    font-weight: 800;
}


.course-content h3 {

    font-size: 16px;

    margin: 10px 0 6px;
}


.course-content p {

    font-size: 9px;

    color: #7d8799;

    line-height: 1.6;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-row {

    display: flex;

    justify-content: space-between;

    margin-top: 13px;

    font-size: 8px;
}


.progress {

    height: 7px;

    background: #e9edf3;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 6px;
}


.progress span {

    display: block;

    height: 100%;

    background: #1764c2;

    border-radius: 20px;
}


.meta {

    display: flex;

    flex-wrap: wrap;

    gap: 13px;

    margin: 12px 0;

    color: #7f899a;

    font-size: 8px;
}


/* =====================================================
   BUTTON
===================================================== */

.primary-button,
.secondary-button {

    padding: 9px 13px;

    border-radius: 8px;

    border: none;

    font-size: 9px;

    font-weight: 700;

    cursor: pointer;
}


.primary-button {

    background: #1764c2;

    color: white;
}


.secondary-button {

    background: #edf4ff;

    color: #1764c2;
}


/* =====================================================
   RECOMMENDATION
===================================================== */

.recommendations {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 11px;
}


.recommendation {

    overflow: hidden;

    padding: 0;
}


.recommendation-cover {

    height: 92px;

    display: grid;

    place-items: center;

    font-size: 44px;

    background: #edf3fc;
}


.recommendation-content {

    padding: 11px;
}


.recommendation-content small {

    color: #1764c2;

    font-size: 7px;

    font-weight: 800;
}


.recommendation-content h3 {

    font-size: 10px;

    margin: 5px 0;
}


.recommendation-content p {

    color: #8993a5;

    font-size: 8px;

    margin-bottom: 8px;
}


/* =====================================================
   TARGET
===================================================== */

.target {

    text-align: center;
}


.target-header {

    display: flex;

    justify-content: space-between;

    text-align: left;
}


.target-header h2 {

    font-size: 13px;
}


.streak {

    background: #fff2dc;

    color: #a86b00;

    padding: 5px 8px;

    border-radius: 20px;

    font-size: 8px;
}


.progress-ring {

    width: 118px;

    height: 118px;

    margin: 17px auto;

    border-radius: 50%;

    background:
        conic-gradient(
            #1764c2 0 70%,
            #e8edf4 70%
        );

    display: grid;

    place-items: center;

    position: relative;
}


.progress-ring::before {

    content: "";

    position: absolute;

    width: 88px;

    height: 88px;

    border-radius: 50%;

    background: white;
}


.progress-ring div {

    position: relative;
}


.progress-ring b {

    display: block;

    font-size: 20px;
}


.progress-ring small {

    font-size: 8px;

    color: #8993a5;
}


.full-button {

    width: 100%;

    margin-top: 12px;
}


/* =====================================================
   QUICK ACCESS
===================================================== */

.quick-access {

    margin-top: 13px;
}


.quick-access h2 {

    font-size: 13px;

    margin-bottom: 5px;
}


.quick-item {

    width: 100%;

    border: none;

    border-bottom: 1px solid #edf0f4;

    background: white;

    padding: 12px 0;

    display: flex;

    align-items: center;

    gap: 10px;

    text-align: left;

    cursor: pointer;
}


.quick-icon {

    width: 31px;

    height: 31px;

    background: #edf4ff;

    color: #1764c2;

    border-radius: 8px;

    display: grid;

    place-items: center;
}


.quick-item-content {

    flex: 1;
}


.quick-item-content b {

    display: block;

    font-size: 9px;
}


.quick-item-content small {

    font-size: 7px;

    color: #8993a5;
}


/* =====================================================
   GENERIC PAGE
===================================================== */

.page-header {

    display: flex;

    justify-content: space-between;

    align-items: end;

    margin-bottom: 18px;
}


.page-header h1 {

    font-size: 24px;

    margin: 6px 0;
}


.page-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 13px;
}


.feature-card {

    background: white;

    border: 1px solid #e1e6ee;

    border-radius: 13px;

    padding: 18px;
}


.feature-icon {

    width: 48px;

    height: 48px;

    background: #edf4ff;

    border-radius: 12px;

    display: grid;

    place-items: center;

    font-size: 25px;

    margin-bottom: 13px;
}


.feature-card h3 {

    font-size: 12px;

    margin-bottom: 7px;
}


.feature-card p {

    color: #8993a5;

    font-size: 9px;

    line-height: 1.6;

    margin-bottom: 10px;
}


/* =====================================================
   FORM
===================================================== */

.settings-form {

    max-width: 650px;

    display: grid;

    gap: 13px;
}


.form-field {

    display: grid;

    gap: 5px;
}


.form-field label {

    font-size: 9px;

    font-weight: 700;
}


.form-field input,
.form-field select {

    width: 100%;

    padding: 10px;

    border: 1px solid #dfe4ec;

    border-radius: 8px;

    outline: none;
}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    z-index: 1000;

    right: 20px;

    bottom: 20px;

    background: #172033;

    color: white;

    padding: 12px 16px;

    border-radius: 9px;

    font-size: 10px;

    display: none;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 900;

    background: rgba(0,0,0,.55);

    display: none;

    place-items: center;

    padding: 20px;
}


.modal.show {

    display: grid;
}


.modal-content {

    position: relative;

    width: min(560px,100%);

    max-height: 85vh;

    overflow-y: auto;

    background: white;

    border-radius: 15px;

    padding: 25px;
}


.modal-close {

    position: absolute;

    right: 12px;

    top: 6px;

    border: none;

    background: none;

    font-size: 27px;

    cursor: pointer;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark {

    background: #101521;

    color: #eaf0fa;
}


body.dark .topbar {

    border-color: #293346;
}


body.dark .panel,
body.dark .stat,
body.dark .feature-card,
body.dark .search-box,
body.dark .top-button,
body.dark .quick-item,
body.dark .modal-content {

    background: #171e2c;

    color: #eaf0fa;

    border-color: #293346;
}


body.dark .course-cover {

    background: #222c3d;
}


body.dark .progress {

    background: #30394a;
}


body.dark .progress-ring::before {

    background: #171e2c;
}


body.dark .muted,
body.dark .course-content p,
body.dark .feature-card p {

    color: #aab5c7;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px) {

    .sidebar {

        width: 72px;
    }

    .brand div,
    .user-mini div:not(.avatar),
    .nav-item,
    .support-button span {

        font-size: 0;
    }

    .brand,
    .user-mini {

        justify-content: center;
    }

    .nav-item {

        justify-content: center;
    }

    .main-content {

        margin-left: 72px;
    }

    .stats {

        grid-template-columns:
            repeat(2,1fr);
    }
}


@media(max-width:720px) {

    .sidebar {

        width: 0;

        padding: 0;

        overflow: hidden;
    }

    .sidebar.open {

        width: 235px;

        padding: 17px 12px;
    }

    .sidebar.open .brand div,
    .sidebar.open .user-mini div:not(.avatar),
    .sidebar.open .nav-item,
    .sidebar.open .support-button span {

        font-size: initial;
    }

    .main-content {

        margin-left: 0;

        padding:
            0 14px
            30px;
    }

    .mobile-menu {

        display: block;
    }

    .topbar {

        height: 61px;
    }

    .search-box {

        flex: 1;

        width: auto;
    }

    .top-user div:last-child {

        display: none;
    }

    .stats {

        grid-template-columns:
            repeat(2,1fr);
    }

    .dashboard-grid {

        grid-template-columns: 1fr;
    }

    .course {

        grid-template-columns: 1fr;
    }

    .course-cover {

        min-height: 130px;
    }

    .recommendations,
    .page-grid {

        grid-template-columns: 1fr;
    }

    .page-header {

        align-items: flex-start;

        gap: 10px;
    }
}
</style>

</head>

<!-- JAVASCRIPT -->

<script>
/* =====================================================
   AKU BISA USER APPLICATION
===================================================== */


/* =====================================================
   GLOBAL STATE
===================================================== */

const appState = {

    currentPage: "dashboard",

    darkMode: false,

    search: ""

};


/* =====================================================
   PAGE DATA
===================================================== */

const pageData = {

    languages: {

        title: "Semua Bahasa",

        description:
            "Pilih bahasa yang ingin kamu pelajari.",

        items: [

            ["🇯🇵", "Bahasa Jepang", "Pemula • 24 materi"],

            ["🇬🇧", "Bahasa Inggris", "Beginner • 30 materi"],

            ["🇰🇷", "Bahasa Korea", "Pemula • 20 materi"],

/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

    toastElement.textContent = message;

    toastElement.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toastElement.style.display = "none";

        }, 2200);
}

}

}

/* =====================================================
   BUTTON TEXT
===================================================== */

function getButtonText(page) {

    if (page === "certificate") {

        return "Lihat Sertifikat";

    }

    if (page === "premium") {

        return "Pilih Paket";

    }

    if (page === "profile") {

        return "Edit";

    }

    if (page === "achievement") {

        return "Lihat";

    }

    if (
        page === "quiz" ||
        page === "practice"
    ) {

        return "Mulai";

    }

    return "Buka";

}


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(page) {

    appState.currentPage = page;


    document
        .querySelectorAll(".nav-item")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });


    if (page === "dashboard") {

        renderDashboard();

    } else {

        renderGeneric(page);

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    document
        .getElementById("sidebar")
        .classList.remove("open");
}

            🔔 Target harian hampir selesai.
        </p>

        <hr>

        <p>
            🏆 Achievement baru tersedia.
        </p>

        <hr>

        <p>
            📚 Materi baru Bahasa Jepang tersedia.
        </p>

        `

    );

}


/* =====================================================
   SUPPORT
===================================================== */

function showSupport() {

    openModal(

        "Bantuan & Dukungan",

        `

        <p class="muted">
            Selamat datang di pusat bantuan
            AKU BISA.
        </p>

        <br>

        <button
            class="secondary-button full-button"
            onclick="
                showToast('Panduan dibuka');
                closeModal();
            "
        >
            📖 Panduan Penggunaan
        </button>

        <button
            class="secondary-button full-button"
            onclick="
                showToast('Pesan dukungan dibuat');
                closeModal();
            "
        >
            💬 Hubungi Dukungan
        </button>

        `

    );

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleTheme() {

    appState.darkMode =
        !appState.darkMode;

    document.body.classList.toggle(
        "dark",
        appState.darkMode
    );


    showToast(
        appState.darkMode
            ? "Mode gelap aktif"
            : "Mode terang aktif"
    );

}


/* =====================================================
   SEARCH
===================================================== */

function searchApplication() {

    const keyword =
        document
            .getElementById("searchInput")
            .value
            .trim();


    if (!keyword) return;


    appState.search = keyword;


    openModal(

        "Pencarian",

        `

        <p>
            Hasil pencarian untuk:
        </p>

        <br>

        <h3>
            "${keyword}"
        </h3>

        <br>

        <p class="muted">
            Sistem pencarian siap dihubungkan
            dengan database Firebase atau REST API.
        </p>

        `

    );

}


/* =====================================================
   EVENT LISTENERS
===================================================== */


/* Navigation */

document
    .querySelectorAll(".nav-item")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                navigate(
                    button.dataset.page
                );

            }
        );

    });


/* Mobile menu */

document
    .getElementById("mobileMenu")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }
    );


/* Notification */

document
    .getElementById("notificationButton")
    .addEventListener(
        "click",
        showNotifications
    );


/* Theme */

document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        toggleTheme
    );


/* Support */

document
    .getElementById("supportButton")
    .addEventListener(
        "click",
        showSupport
    );


/* Search */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                searchApplication();

            }

        }
    );


/* Modal close */

document
    .getElementById("modalClose")
    .addEventListener(
        "click",
        closeModal
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

function initializeApplication() {

    renderDashboard();

}


/* START APP */

initializeApplication();

</script>
