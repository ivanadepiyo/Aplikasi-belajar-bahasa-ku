
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AKU BISA - Login">
  <title>AKU BISA | Login</title>
  <link rel="stylesheet" href="assets/css/login.css">
<style>
/* =========================================================
   AKU BISA - LOGIN CSS
   ========================================================= */

* {
  box-sizing: border-box;
}

:root {
  --primary: #1769e0;
  --primary-dark: #0f4fac;
  --text: #172033;
  --muted: #6b7280;
  --border: #dce3ee;
  --background: #f4f7fb;
  --danger: #c62828;
  --success: #18794e;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: var(--background);
}

body {
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 44% 56%;
}

.brand-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
  background: linear-gradient(145deg, #1769e0, #0d4fa8);
  color: white;
}

.brand-content {
  width: min(480px, 100%);
}

.logo,
.mobile-logo {
  width: 66px;
  height: 66px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 800;
  background: white;
  color: var(--primary);
  box-shadow: 0 14px 35px rgba(0, 0, 0, .15);
}

.brand-content h1 {
  margin: 24px 0 10px;
  font-size: clamp(38px, 5vw, 64px);
  letter-spacing: -2px;
}

.brand-content p {
  margin: 0;
  line-height: 1.7;
  font-size: 18px;
  opacity: .92;
}

.feature-list {
  display: grid;
  gap: 13px;
  margin-top: 38px;
  font-size: 15px;
}

.login-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px;
}

.login-card {
  width: min(460px, 100%);
  background: white;
  border: 1px solid #e6ebf3;
  border-radius: 22px;
  padding: 38px;
  box-shadow: 0 18px 60px rgba(22, 43, 77, .10);
}

.mobile-logo {
  display: none;
  width: 54px;
  height: 54px;
  border-radius: 15px;
  font-size: 18px;
}

.login-card h2 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin: 8px 0 28px;
  color: var(--muted);
}

.alert {
  min-height: 0;
  margin-bottom: 0;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}

.alert.error,
.alert.success {
  padding: 11px 13px;
  margin-bottom: 18px;
}

.alert.error {
  color: var(--danger);
  background: #fff1f1;
  border: 1px solid #ffd1d1;
}

.alert.success {
  color: var(--success);
  background: #effbf5;
  border: 1px solid #c7efd9;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

.form-group input {
  width: 100%;
  height: 50px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: white;
  transition: .2s ease;
}

.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(23, 105, 224, .10);
}

.form-group input.input-error {
  border-color: #e53935;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 100px;
}

.password-toggle {
  position: absolute;
  right: 8px;
  top: 8px;
  height: 34px;
  border: 0;
  border-radius: 8px;
  padding: 0 9px;
  background: #eef4ff;
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
}

.field-error {
  display: block;
  min-height: 17px;
  margin-top: 5px;
  color: var(--danger);
  font-size: 12px;
}

.login-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 2px 0 22px;
  font-size: 13px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #4b5563;
}

.remember input {
  accent-color: var(--primary);
}

.text-button {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--primary);
  font-weight: 700;
}

.login-button {
  width: 100%;
  height: 50px;
  border: 0;
  border-radius: 11px;
  background: var(--primary);
  color: white;
  font-weight: 800;
  transition: .2s ease;
}

.login-button:hover:not(:disabled) {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

.login-button:disabled {
  cursor: not-allowed;
  opacity: .75;
}

.login-button.loading {
  pointer-events: none;
}

.spinner {
  display: none;
  width: 16px;
  height: 16px;
  margin-left: 7px;
  vertical-align: -3px;
  border: 2px solid rgba(255,255,255,.5);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 16px;
  color: #9aa3b2;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: #e8edf4;
}

.demo-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.demo-button {
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: #344054;
  font-weight: 700;
}

.demo-button:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.security-note {
  margin: 20px 0 0;
  color: #8a94a6;
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15, 23, 42, .55);
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  position: relative;
  width: min(420px, 100%);
  padding: 30px;
  border-radius: 18px;
  background: white;
  box-shadow: 0 25px 80px rgba(0,0,0,.25);
}

.modal-box h3 {
  margin: 0 0 10px;
}

.modal-box p {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.6;
  font-size: 14px;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 14px;
  border: 0;
  background: transparent;
  font-size: 27px;
  color: #6b7280;
}

.modal-ok {
  height: 44px;
}

@media (max-width: 850px) {
  .login-page {
    grid-template-columns: 1fr;
  }

  .brand-panel {
    display: none;
  }

  .login-panel {
    min-height: 100vh;
    padding: 20px;
  }

  .mobile-logo {
    display: grid;
    margin-bottom: 22px;
  }

  .login-card {
    padding: 28px 22px;
    border-radius: 18px;
  }
}

@media (max-width: 420px) {
  .login-panel {
    padding: 12px;
  }

  .login-card {
    padding: 24px 18px;
    border-radius: 15px;
    box-shadow: none;
  }

  .login-options {
    align-items: flex-start;
  }

  .demo-buttons {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>
  <main class="login-page">
    <section class="brand-panel">
      <div class="brand-content">
        <div class="logo">AB</div>
        <h1>AKU BISA</h1>
        <p>Aplikasi Kreatif Untuk Bisa Semua Bahasa</p>
        <div class="feature-list">
          <span>✓ Pembelajaran terstruktur</span>
          <span>✓ Latihan dan evaluasi</span>
          <span>✓ Akses User & Admin</span>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="mobile-logo">AB</div>
        <h2>Selamat Datang</h2>
        <p class="subtitle">Masuk ke akun AKU BISA Anda</p>

        <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="identity">Username atau Email</label>
            <input id="identity" name="identity" type="text"
                   placeholder="Masukkan username atau email"
                   autocomplete="username">
            <small id="identityError" class="field-error"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password"
                     placeholder="Masukkan password"
                     autocomplete="current-password">
              <button type="button" id="togglePassword" class="password-toggle"
                      aria-label="Tampilkan password">Tampilkan</button>
            </div>
            <small id="passwordError" class="field-error"></small>
          </div>

          <div class="login-options">
            <label class="remember">
              <input id="rememberMe" type="checkbox">
              <span>Ingat saya</span>
            </label>
            <button type="button" id="forgotPassword" class="text-button">
              Lupa password?
            </button>
          </div>

          <button id="loginButton" class="login-button" type="submit">
            <span id="loginButtonText">Masuk</span>
            <span id="loginSpinner" class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="demo-section">
          <div class="divider"><span>AKUN UJI COBA</span></div>
          <div class="demo-buttons">
            <button type="button" class="demo-button" data-demo="user">
              User Demo
            </button>
            <button type="button" class="demo-button" data-demo="admin">
              Admin Demo
            </button>
          </div>
        </div>

        <p class="security-note">🔒 Sistem autentikasi siap dikembangkan ke Firebase Authentication.</p>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <button id="closeModal" class="modal-close" type="button" aria-label="Tutup">×</button>
      <h3 id="modalTitle">Informasi</h3>
      <p id="modalText"></p>
      <button id="modalOk" class="login-button modal-ok" type="button">Mengerti</button>
    </div>
  </div>

  <script src="assets/js/auth-config.js">
/* =========================================================
   AKU BISA - KONFIGURASI LOGIN
   Ubah bagian redirect agar sesuai nama dashboard Ayah.
   ========================================================= */

const AUTH_CONFIG = {
  mode: "demo",

  redirect: {
    user: "dasboard_user.html",
    admin: "dasboard_adm.html"
  },

  session: {
    key: "akuBisaAuthSession",
    maxAgeHours: 8
  },

  /* AKUN DEMO - HANYA UNTUK TESTING LOKAL */
  demoUsers: [
    {
      id: "USR001",
      username: "ivan",
      email: "ivan@akubisa.com",
      password: "User123",
      role: "user",
      status: "active",
      name: "Ivan Adepiyo"
    },
    {
      id: "ADM001",
      username: "admin",
      email: "admin@akubisa.com",
      password: "Admin123",
      role: "admin",
      status: "active",
      name: "Administrator"
    }
  ]
};

</script>
  <script src="assets/js/auth.js">
/* =========================================================
   AKU BISA - AUTHENTICATION ENGINE
   Pusat validasi session dan role.
   ========================================================= */

(function () {
  "use strict";

  const CONFIG = window.AUTH_CONFIG;
  const SESSION_KEY = CONFIG.session.key;

  function getStorage(remember) {
    return remember ? localStorage : sessionStorage;
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  }

  function createSession(user, remember) {
    clearSession();

    const session = {
      authenticated: true,
      userId: user.id,
      username: user.username,
      email: user.email,
      name: user.name,
      role: user.role,
      status: user.status,
      loginAt: Date.now(),
      expiresAt: Date.now() + CONFIG.session.maxAgeHours * 60 * 60 * 1000
    };

    getStorage(remember).setItem(SESSION_KEY, JSON.stringify(session));
    return session;
  }

  function readSession() {
    let raw = sessionStorage.getItem(SESSION_KEY);
    let storage = sessionStorage;

    if (!raw) {
      raw = localStorage.getItem(SESSION_KEY);
      storage = localStorage;
    }

    if (!raw) return null;

    try {
      const session = JSON.parse(raw);

      if (!session.authenticated || !session.role || !session.expiresAt) {
        clearSession();
        return null;
      }

      if (Date.now() >= session.expiresAt) {
        clearSession();
        return null;
      }

      if (!["user", "admin"].includes(session.role)) {
        clearSession();
        return null;
      }

      if (session.status !== "active") {
        clearSession();
        return null;
      }

      return { ...session, _storage: storage };
    } catch (error) {
      clearSession();
      return null;
    }
  }

  function findDemoUser(identity, password) {
    const value = identity.trim().toLowerCase();

    return CONFIG.demoUsers.find(function (user) {
      const usernameMatch = user.username.toLowerCase() === value;
      const emailMatch = user.email.toLowerCase() === value;
      return (usernameMatch || emailMatch) && user.password === password;
    }) || null;
  }

  function authenticate(identity, password, remember) {
    if (CONFIG.mode !== "demo") {
      throw new Error("Mode autentikasi belum dikonfigurasi.");
    }

    const user = findDemoUser(identity, password);

    if (!user) {
      return {
        success: false,
        message: "Username/email atau password tidak benar."
      };
    }

    if (user.status !== "active") {
      return {
        success: false,
        message: "Akun Anda tidak aktif. Silakan hubungi administrator."
      };
    }

    const session = createSession(user, remember);

    return {
      success: true,
      session: session,
      redirect: CONFIG.redirect[user.role]
    };
  }

  function logout() {
    clearSession();
    window.location.replace("login.html");
  }

  function requireAuth(requiredRole) {
    const session = readSession();

    if (!session) {
      window.location.replace("login.html");
      return null;
    }

    if (requiredRole && session.role !== requiredRole) {
      const correctPage = CONFIG.redirect[session.role];

      if (correctPage) {
        window.location.replace(correctPage);
      } else {
        logout();
      }

      return null;
    }

    return session;
  }

  window.AkuBisaAuth = {
    authenticate,
    readSession,
    requireAuth,
    logout,
    clearSession
  };
})();

</script>
  <script src="assets/js/login.js">
/* =========================================================
   AKU BISA - LOGIN CONTROLLER
   ========================================================= */

document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  const form = document.getElementById("loginForm");
  const identity = document.getElementById("identity");
  const password = document.getElementById("password");
  const rememberMe = document.getElementById("rememberMe");
  const loginButton = document.getElementById("loginButton");
  const loginButtonText = document.getElementById("loginButtonText");
  const loginSpinner = document.getElementById("loginSpinner");
  const togglePassword = document.getElementById("togglePassword");
  const alertBox = document.getElementById("alertBox");
  const identityError = document.getElementById("identityError");
  const passwordError = document.getElementById("passwordError");

  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const modalText = document.getElementById("modalText");
  const closeModal = document.getElementById("closeModal");
  const modalOk = document.getElementById("modalOk");

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.className = "alert " + type;
  }

  function clearAlert() {
    alertBox.textContent = "";
    alertBox.className = "alert";
  }

  function clearErrors() {
    identityError.textContent = "";
    passwordError.textContent = "";
    identity.classList.remove("input-error");
    password.classList.remove("input-error");
  }

  function validateForm() {
    clearErrors();
    let valid = true;

    if (!identity.value.trim()) {
      identityError.textContent = "Username atau email wajib diisi.";
      identity.classList.add("input-error");
      valid = false;
    }

    if (!password.value) {
      passwordError.textContent = "Password wajib diisi.";
      password.classList.add("input-error");
      valid = false;
    }

    return valid;
  }

  function setLoading(loading) {
    loginButton.disabled = loading;
    loginButton.classList.toggle("loading", loading);
    loginButtonText.textContent = loading ? "Memeriksa..." : "Masuk";
    loginSpinner.style.display = loading ? "inline-block" : "none";
  }

  function openModal(title, text) {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
  }

  function hideModal() {
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");
  }

  /* Jika session masih aktif dan user membuka login lagi,
     arahkan otomatis ke dashboard sesuai role. */
  const existingSession = AkuBisaAuth.readSession();

  if (existingSession) {
    window.location.replace(AUTH_CONFIG.redirect[existingSession.role]);
    return;
  }

  togglePassword.addEventListener("click", function () {
    const isPassword = password.type === "password";
    password.type = isPassword ? "text" : "password";
    togglePassword.textContent = isPassword ? "Sembunyikan" : "Tampilkan";
    togglePassword.setAttribute(
      "aria-label",
      isPassword ? "Sembunyikan password" : "Tampilkan password"
    );
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearAlert();

    if (!validateForm()) return;

    setLoading(true);

    /* Sedikit delay agar proses terlihat natural saat testing. */
    setTimeout(function () {
      const result = AkuBisaAuth.authenticate(
        identity.value,
        password.value,
        rememberMe.checked
      );

      if (!result.success) {
        setLoading(false);
        showAlert(result.message, "error");
        password.value = "";
        password.focus();
        return;
      }

      showAlert("Login berhasil. Mengalihkan...", "success");

      setTimeout(function () {
        window.location.replace(result.redirect);
      }, 400);
    }, 350);
  });

  document.querySelectorAll("[data-demo]").forEach(function (button) {
    button.addEventListener("click", function () {
      const type = button.dataset.demo;

      if (type === "user") {
        identity.value = "ivan";
        password.value = "User123";
      } else {
        identity.value = "admin";
        password.value = "Admin123";
      }

      clearErrors();
      clearAlert();
      password.focus();
    });
  });

  document.getElementById("forgotPassword").addEventListener("click", function () {
    openModal(
      "Lupa Password",
      "Fitur reset password belum diaktifkan pada mode demo. Saat menggunakan Firebase Authentication, bagian ini dapat dihubungkan ke reset password melalui email."
    );
  });

  closeModal.addEventListener("click", hideModal);
  modalOk.addEventListener("click", hideModal);

  modal.addEventListener("click", function (event) {
    if (event.target === modal) hideModal();
  });

  [identity, password].forEach(function (input) {
    input.addEventListener("input", function () {
      input.classList.remove("input-error");
      clearAlert();
    });
  });
});
</script>

</body>
</html>
