<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =====================================================
         META DASAR
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AKU BISA - Aplikasi Kreatif Untuk Bisa Semua Bahasa"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <!-- =====================================================
         JUDUL HALAMAN
    ====================================================== -->

    <title>AKU BISA - Login</title>


    <!-- =====================================================
         GOOGLE FONTS - POPPINS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>
    <style>

        :root {
            --primary-blue: #1764D8;
            --button-blue: #1976E8;
            --dark-blue: #153B63;

            --background-blue: #EEF6FF;
            --white: #FFFFFF;

            --text-gray: #66768A;
            --placeholder-gray: #AEB7C2;

            --border-gray: #DDE3EA;

            --illustration-blue: #76B6D8;

            --yellow: #F5B82E;

            --success: #218838;
            --error: #D83B3B;

            --card-shadow:
                0 10px 35px rgba(30, 70, 110, 0.10);

            --button-shadow:
                0 5px 12px rgba(25, 118, 232, 0.18);

            --transition: 0.2s ease;
        }


        /* =====================================================
           02. RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100vh;

            font-family:
                "Poppins",
                Arial,
                sans-serif;

            background-color: var(--white);

            color: var(--dark-blue);
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
        }

        img {
            max-width: 100%;
            display: block;
        }


        /* =====================================================
           03. HALAMAN UTAMA
        ====================================================== */

        .page {
            width: 100%;
            min-height: 100vh;

            padding-bottom: 25px;
        }


        /* =====================================================
           04. CONTAINER UTAMA
        ====================================================== */

        .main-container {
            width: 95%;
            max-width: 1450px;

            min-height: 890px;

            margin: 55px auto 0 auto;

            background-color:
                var(--background-blue);

            border-radius: 28px;

            display: flex;

            overflow: hidden;
        }


        /* =====================================================
           05. BAGIAN KIRI / BRANDING
        ====================================================== */

        .branding-section {
            position: relative;

            width: 50%;
            min-height: 890px;

            padding:
                75px 40px 40px 40px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            overflow: hidden;
        }


        /* =====================================================
           06. LOGO
        ====================================================== */

        .logo-area {
            position: relative;

            z-index: 5;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }


        /* =====================================================
           07. IKON WISUDA
        ====================================================== */

        .graduation-icon {
            width: 75px;
            height: 75px;

            flex-shrink: 0;

            position: relative;

            top: -5px;

            color:
                var(--primary-blue);
        }

        .graduation-icon svg {
            width: 100%;
            height: 100%;

            display: block;
        }


        /* =====================================================
           08. JUDUL AKU BISA
        ====================================================== */

        .logo-area h1 {
            margin: 0;

            color:
                var(--primary-blue);

            font-size: 72px;

            font-weight: 800;

            letter-spacing: -2px;

            line-height: 1;
        }


        /* =====================================================
           09. TAGLINE
        ====================================================== */

        .tagline {
            position: relative;

            z-index: 5;

            margin:
                12px 0 0 0;

            color:
                var(--text-gray);

            font-size: 21px;

            font-weight: 400;

            line-height: 1.4;

            text-align: center;
        }


        /* =====================================================
           10. FOTO PELAJAR
        ====================================================== */

        .student-photo {
            position: relative;

            z-index: 4;

            width: 90%;

            max-width: 650px;

            margin-top: 40px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .student-photo img {
            width: 100%;

            height: auto;

            object-fit: contain;
        }


        /* =====================================================
           11. ORNAMEN
        ====================================================== */

        .decorations {
            position: absolute;

            inset: 0;

            z-index: 1;

            pointer-events: none;
        }

        .decoration {
            position: absolute;

            color:
                var(--illustration-blue);

            opacity: 0.65;

            user-select: none;
        }


        /* =====================================================
           12. PLUS
        ====================================================== */

        .decoration-plus {
            top: 220px;
            left: 35px;

            font-size: 34px;

            font-weight: 500;
        }


        /* =====================================================
           13. BINTANG
        ====================================================== */

        .decoration-star {
            top: 410px;
            left: 50px;

            font-size: 38px;
        }


        /* =====================================================
           14. GLOBE
        ====================================================== */

        .decoration-globe {
            top: 510px;
            left: 70px;

            width: 45px;
            height: 45px;
        }

        .decoration-globe svg {
            width: 100%;
            height: 100%;

            fill: none;

            stroke:
                currentColor;

            stroke-width: 1.5;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           15. BUKU
        ====================================================== */

        .decoration-book {
            top: 350px;
            left: 100px;

            width: 40px;
            height: 40px;
        }

        .decoration-book svg {
            width: 100%;
            height: 100%;

            fill: none;

            stroke:
                currentColor;

            stroke-width: 1.5;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           16. HURUF A
        ====================================================== */

        .decoration-a {
            top: 350px;
            right: 80px;

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                2px solid currentColor;

            border-radius: 9px;

            font-size: 23px;

            font-weight: 600;

            transform:
                rotate(7deg);
        }


        /* =====================================================
           17. POLA TITIK
        ====================================================== */

        .decoration-dots {
            top: 45px;
            right: 70px;

            width: 95px;
            height: 75px;

            display: grid;

            grid-template-columns:
                repeat(5, 6px);

            grid-auto-rows: 6px;

            gap: 10px;

            opacity: 0.45;
        }

        .decoration-dots i {
            width: 5px;
            height: 5px;

            display: block;

            background:
                var(--illustration-blue);

            border-radius: 50%;
        }


        /* =====================================================
           18. LINGKARAN
        ====================================================== */

        .decoration-circle {
            right: 50px;
            bottom: 180px;

            width: 20px;
            height: 20px;

            background:
                var(--illustration-blue);

            border-radius: 50%;

            opacity: 0.75;
        }


        /* =====================================================
           19. BINTANG KECIL
        ====================================================== */

        .decoration-small-star {
            right: 105px;
            bottom: 250px;

            font-size: 25px;
        }


        /* =====================================================
           20. PLUS KECIL
        ====================================================== */

        .decoration-small-plus {
            right: 35px;
            top: 205px;

            font-size: 27px;
        }


        /* =====================================================
           21. LINGKARAN KECIL
        ====================================================== */

        .decoration-small-circle {
            left: 35px;
            bottom: 275px;

            width: 12px;
            height: 12px;

            border:
                2px solid
                var(--illustration-blue);

            border-radius: 50%;
        }


        /* =====================================================
           22. BAGIAN LOGIN
        ====================================================== */

        .login-section {
            width: 50%;

            padding:
                25px 35px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           23. LOGIN CARD
        ====================================================== */

        .login-card {
            width: 600px;

            max-width: 100%;

            min-height: 850px;

            padding:
                60px 65px;

            background:
                var(--white);

            border-radius: 32px;

            box-shadow:
                var(--card-shadow);
        }


        /* =====================================================
           24. HEADER LOGIN
        ====================================================== */

        .login-header {
            text-align: center;
        }

        .login-header h2 {
            margin:
                0 0 10px 0;

            color:
                var(--dark-blue);

            font-size: 34px;

            font-weight: 700;

            line-height: 1.2;
        }

        .login-header p {
            margin:
                0 0 45px 0;

            color:
                var(--text-gray);

            font-size: 19px;

            font-weight: 400;

            line-height: 1.4;
        }


        /* =====================================================
           25. FORM GROUP
        ====================================================== */

        .form-group {
            width: 100%;
        }

        .password-group {
            margin-top: 25px;
        }

        .form-group label {
            display: block;

            margin-bottom: 10px;

            color:
                var(--dark-blue);

            font-size: 17px;

            font-weight: 600;

            line-height: 1.4;
        }


        /* =====================================================
           26. INPUT WRAPPER
        ====================================================== */

        .input-wrapper {
            position: relative;

            width: 100%;
            height: 68px;

            display: flex;

            align-items: center;
        }


        /* =====================================================
           27. INPUT
        ====================================================== */

        .input-wrapper input {
            width: 100%;
            height: 68px;

            padding:
                0 58px;

            background:
                var(--white);

            border:
                1.5px solid
                var(--border-gray);

            border-radius: 13px;

            outline: none;

            color:
                var(--dark-blue);

            font-size: 16px;

            font-weight: 400;

            transition:
                border-color
                var(--transition),

                box-shadow
                var(--transition);
        }

        .input-wrapper input::placeholder {
            color:
                var(--placeholder-gray);

            opacity: 1;
        }

        .input-wrapper input:focus {
            border-color:
                var(--button-blue);

            box-shadow:
                0 0 0 3px
                rgba(25, 118, 232, 0.10);
        }


        /* =====================================================
           28. INPUT ICON
        ====================================================== */

        .input-icon {
            position: absolute;

            left: 20px;

            width: 22px;
            height: 22px;

            z-index: 2;

            display: flex;

            align-items: center;

            justify-content: center;

            color:
                #66717F;

            pointer-events: none;
        }

        .input-icon svg {
            width: 22px;
            height: 22px;

            fill: none;

            stroke:
                currentColor;

            stroke-width: 1.7;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           29. TOGGLE PASSWORD
        ====================================================== */

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 17px;

            width: 30px;
            height: 30px;

            padding: 4px;

            transform:
                translateY(-50%);

            background:
                transparent;

            color:
                #66717F;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 3;
        }

        .password-toggle svg {
            width: 21px;
            height: 21px;

            fill: none;

            stroke:
                currentColor;

            stroke-width: 1.7;

            stroke-linecap: round;

            stroke-linejoin: round;
        }

        .password-toggle .eye-closed {
            display: none;
        }

        .password-toggle.visible .eye-open {
            display: none;
        }

        .password-toggle.visible .eye-closed {
            display: block;
        }

        .password-toggle:hover {
            color:
                var(--dark-blue);
        }


        /* =====================================================
           30. ERROR MESSAGE
        ====================================================== */

        .error-message {
            display: block;

            min-height: 20px;

            margin-top: 6px;

            color:
                var(--error);

            font-size: 13px;

            font-weight: 500;

            line-height: 1.4;
        }


        /* =====================================================
           31. FORM OPTIONS
        ====================================================== */

        .form-options {
            margin-top: 12px;

            margin-bottom: 28px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        /* =====================================================
           32. INGAT SAYA
        ====================================================== */

        .remember-label {
            display: flex;

            align-items: center;

            gap: 9px;

            margin: 0;

            color:
                var(--text-gray);

            font-size: 16px;

            font-weight: 400;

            cursor: pointer;
        }

        .remember-label input {
            width: 22px;
            height: 22px;

            margin: 0;

            accent-color:
                var(--button-blue);

            cursor: pointer;
        }


        /* =====================================================
           33. LUPA PASSWORD
        ====================================================== */

        .forgot-button {
            padding: 0;

            background:
                transparent;

            color:
                var(--button-blue);

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                color
                var(--transition);
        }

        .forgot-button:hover {
            color:
                #145FC2;

            text-decoration: underline;
        }


        /* =====================================================
           34. TOMBOL MASUK
        ====================================================== */

        .login-button {
            width: 100%;
            height: 66px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            background:
                var(--button-blue);

            color:
                var(--white);

            border-radius: 13px;

            box-shadow:
                var(--button-shadow);

            font-size: 19px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background
                var(--transition),

                transform
                var(--transition),

                box-shadow
                var(--transition);
        }

        .login-button svg {
            width: 24px;
            height: 24px;

            fill: none;

            stroke:
                currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }

        .login-button:hover {
            background:
                #145FC2;

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 16px
                rgba(25, 118, 232, 0.25);
        }

        .login-button:active {
            transform:
                translateY(0);
        }


        /* =====================================================
           35. PESAN FORM
        ====================================================== */

        .form-message {
            min-height: 25px;

            margin-top: 12px;

            text-align: center;

            font-size: 14px;

            font-weight: 500;

            line-height: 1.4;
        }

        .form-message.success {
            color:
                var(--success);
        }

        .form-message.info {
            color:
                var(--button-blue);
        }


        /* =====================================================
           36. SEPARATOR
        ====================================================== */

        .separator {
            width: 100%;

            margin:
                35px 0 25px 0;

            display: flex;

            align-items: center;

            gap: 16px;
        }

        .separator span {
            height: 1px;

            flex: 1;

            background:
                #E2E7ED;
        }

        .separator p {
            margin: 0;

            flex-shrink: 0;

            color:
                #7B8794;

            font-size: 16px;

            font-weight: 400;
        }


        /* =====================================================
           37. LOGIN SOSIAL
        ====================================================== */

        .social-login {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 25px;
        }

        /* =====================================================
           38. TOMBOL SOSIAL
        ====================================================== */

        .social-button {
            height: 60px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            background:
                var(--white);

            border:
                1.5px solid
                var(--border-gray);

            border-radius: 13px;

            color:
                #46576A;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            transition:
                border-color
                var(--transition),

                background
                var(--transition);
        }

        .social-button:hover {
            border-color:
                #B8C5D2;

            background:
                #FAFCFE;
        }

        .social-button svg {
            width: 23px;
            height: 23px;

            flex-shrink: 0;
        }


        /* =====================================================
           39. AREA PENDAFTARAN
        ====================================================== */

        .register-area {
            margin-top: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 4px;

            color:
                var(--text-gray);

            font-size: 16px;

            font-weight: 400;

            text-align: center;
        }

        .register-area button {
            padding: 0;

            background:
                transparent;

            color:
                var(--button-blue);

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        .register-area button:hover {
            color:
                #145FC2;

            text-decoration: underline;
        }


        /* =====================================================
           40. FOOTER
        ====================================================== */

        footer {
            margin-top: 30px;

            text-align: center;

            color:
                #7C8793;

            font-size: 15px;

            font-weight: 400;
        }


        /* =====================================================
           41. ACCESSIBILITY
        ====================================================== */

        button:focus-visible,
        input:focus-visible {
            outline:
                3px solid
                rgba(25, 118, 232, 0.20);

            outline-offset: 2px;
        }


        /* =====================================================
           42. TABLET
        ====================================================== */

        @media (
            min-width: 768px
        ) and (
            max-width: 1199px
        ) {

            .main-container {
                width: 96%;

                margin-top: 35px;

                min-height: 820px;

                border-radius: 25px;
            }

            .branding-section {
                min-height: 820px;

                padding:
                    55px 25px 25px 25px;
            }

            .logo-area h1 {
                font-size: 55px;
            }

            .graduation-icon {
                width: 62px;
                height: 62px;
            }

            .tagline {
                font-size: 17px;
            }

            .student-photo {
                width: 95%;

                margin-top: 30px;
            }

            .login-section {
                padding: 20px;
            }

            .login-card {
                min-height: 790px;

                padding: 45px;
            }

            .login-header h2 {
                font-size: 30px;
            }

            .login-header p {
                font-size: 17px;

                margin-bottom: 35px;
            }

            .form-group label {
                font-size: 16px;
            }

            .input-wrapper,
            .input-wrapper input {
                height: 62px;
            }

            .login-button {
                height: 62px;
            }

            .separator {
                margin-top: 28px;
            }

            .social-login {
                gap: 15px;
            }

            .decoration-globe {
                left: 30px;
            }

            .decoration-book {
                left: 55px;
            }

            .decoration-a {
                right: 35px;
            }

            .decoration-dots {
                right: 35px;
            }
        }


        /* =====================================================
           43. MOBILE
        ====================================================== */

        @media (
            max-width: 767px
        ) {

            body {
                overflow-x: hidden;
            }

            .page {
                padding-bottom: 0;
            }

            .main-container {
                width: 100%;

                min-height: auto;

                margin: 0;

                border-radius: 0;

                flex-direction: column;

                overflow: visible;
            }


            /* Branding */

            .branding-section {
                width: 100%;

                min-height: auto;

                padding:
                    40px 20px 20px 20px;
            }


            /* Logo */

            .logo-area {
                gap: 4px;
            }

            .logo-area h1 {
                font-size: 42px;

                letter-spacing: -1.5px;
            }

            .graduation-icon {
                width: 46px;
                height: 46px;

                top: -4px;
            }


            /* Tagline */

            .tagline {
                max-width: 350px;

                margin-top: 10px;

                font-size: 15px;
            }


            /* Foto */

            .student-photo {
                width: 100%;

                max-width: 500px;

                margin-top: 25px;
            }


            /* Dekorasi */

            .decoration-plus,
            .decoration-star,
            .decoration-globe,
            .decoration-book,
            .decoration-a,
            .decoration-small-star {
                display: none;
            }

            .decoration-dots {
                top: 25px;

                right: 20px;

                transform:
                    scale(0.7);

                transform-origin:
                    top right;
            }

            .decoration-circle {
                right: 20px;

                bottom: 40px;

                width: 15px;
                height: 15px;
            }

            .decoration-small-plus {
                right: 18px;

                top: 120px;

                font-size: 22px;
            }

            .decoration-small-circle {
                left: 20px;

                bottom: 90px;
            }


            /* Login Section */

            .login-section {
                width: 100%;

                padding: 20px;
            }


            /* Login Card */

            .login-card {
                width: 100%;

                min-height: auto;

                padding:
                    35px 25px;

                border-radius: 24px;
            }


            /* Header */

            .login-header h2 {
                font-size: 28px;
            }

            .login-header p {
                margin-bottom: 32px;

                font-size: 16px;
            }


            /* Label */

            .form-group label {
                font-size: 16px;
            }


            /* Input */

            .input-wrapper,
            .input-wrapper input {
                height: 60px;
            }

            .input-wrapper input {
                padding-left: 54px;

                padding-right: 52px;

                font-size: 15px;
            }

            .input-icon {
                left: 18px;
            }

            .password-toggle {
                right: 14px;
            }


            /* Options */

            .form-options {
                margin-top: 10px;

                gap: 10px;
            }

            .remember-label {
                gap: 7px;

                font-size: 14px;
            }

            .remember-label input {
                width: 20px;
                height: 20px;
            }

            .forgot-button {
                font-size: 14px;
            }


            /* Login Button */

            .login-button {
                height: 60px;

                font-size: 17px;
            }


            /* Separator */

            .separator {
                margin:
                    30px 0 22px 0;

                gap: 10px;
            }

            .separator p {
                font-size: 14px;
            }


            /* Social Login */

            .social-login {
                grid-template-columns:
                    1fr;

                gap: 12px;
            }

            .social-button {
                height: 58px;
            }


            /* Register */

            .register-area {
                margin-top: 30px;

                flex-wrap: wrap;

                font-size: 14px;
            }

            .register-area button {
                font-size: 14px;
            }


            /* Footer */

            footer {
                margin-top: 0;

                padding: 20px;

                font-size: 13px;
            }
        }


        /* =====================================================
           44. MOBILE KECIL
        ====================================================== */

        @media (
            max-width: 400px
        ) {

            .branding-section {
                padding-top: 30px;
            }

            .logo-area h1 {
                font-size: 37px;
            }

            .graduation-icon {
                width: 42px;
                height: 42px;
            }

            .tagline {
                font-size: 14px;
            }

            .login-section {
                padding: 14px;
            }

            .login-card {
                padding:
                    30px 20px;
            }

            .login-header h2 {
                font-size: 25px;
            }

            .login-header p {
                font-size: 15px;
            }

            .form-options {
                align-items: flex-start;
            }

            .remember-label span,
            .forgot-button {
                font-size: 13px;
            }

            .separator p {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================================
         04. HALAMAN UTAMA
    ====================================================== -->

    <div class="page">

        <!-- =================================================
             05. CONTAINER UTAMA
        ================================================== -->

        <main class="main-container">

            <!-- BAGIAN KIRI TETAP -->

            <section
                class="branding-section"
                aria-label="Branding AKU BISA"
            >

                <!--
                    Semua decorations,
                    logo,
                    tagline,
                    student-photo
                    TETAP seperti kode Ayah.
                -->

            </section>


            <!-- =================================================
                 10. BAGIAN KANAN / LOGIN
            ================================================== -->

            <section
                class="login-section"
                aria-label="Form login"
            >

                <div class="login-card">

                    <header class="login-header">

                        <h2>
                            Selamat Datang Kembali
                        </h2>

                        <p>
                            Masuk untuk melanjutkan perjalanan belajarmu.
                        </p>

                    </header>


                    <form
                        id="loginForm"
                        novalidate
                    >

                        <!-- USERNAME / EMAIL -->

                        <div class="form-group">

                            <label for="username">
                                Email atau Username
                            </label>

                            <div class="input-wrapper">

                                <span
                                    class="input-icon"
                                    aria-hidden="true"
                                >
                                    <!-- SVG USER TETAP -->
                                </span>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Masukkan email atau username"
                                    autocomplete="username"
                                    spellcheck="false"
                                >

                            </div>

                            <span
                                id="usernameError"
                                class="error-message"
                                role="alert"
                                aria-live="polite"
                            ></span>

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group password-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <span
                                    class="input-icon"
                                    aria-hidden="true"
                                >
                                    <!-- SVG LOCK TETAP -->
                                </span>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="password-toggle"
                                    aria-label="Tampilkan password"
                                    aria-pressed="false"
                                >
                                    <!-- SVG EYE TETAP -->
                                </button>

                            </div>

                            <span
                                id="passwordError"
                                class="error-message"
                                role="alert"
                                aria-live="polite"
                            ></span>

                        </div>


                        <!-- =================================================
                             14. PILIHAN FORM
                        ================================================== -->

                        <div class="form-options">

                            <label class="remember-label">

                                <input
                                    type="checkbox"
                                    id="rememberMe"
                                    name="rememberMe"
                                >

                                <span>
                                    Ingat saya
                                </span>

                            </label>


                            <!-- PERBAIKAN: a ditutup dengan /a -->

                            <a
                                href="lupa-password.html"
                                id="forgotPassword"
                                class="forgot-button"
                            >
                                Lupa password?
                            </a>

                        </div>


                        <!-- =================================================
                             15. TOMBOL MASUK
                        ================================================== -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-button"
                        >

                            <span>
                                Masuk
                            </span>

                            <!-- SVG PANAH TETAP -->

                        </button>


                        <!-- =================================================
                             16. PESAN FORM
                        ================================================== -->

                        <div
                            id="formMessage"
                            class="form-message"
                            role="status"
                            aria-live="polite"
                        ></div>

                    </form>


                    <!-- =================================================
                         17. PEMISAH
                    ================================================== -->

                    <div class="separator">

                        <span aria-hidden="true"></span>

                        <p>
                            atau masuk dengan
                        </p>

                        <span aria-hidden="true"></span>

                    </div>


                    <!-- =================================================
                         18. LOGIN SOSIAL
                    ================================================== -->

                    <div class="social-login">

                        <button
                            type="button"
                            id="googleLogin"
                            class="social-button"
                            aria-label="Masuk dengan Google"
                        >

                            <!-- SVG GOOGLE TETAP -->

                            <span>
                                Google
                            </span>

                        </button>


                        <button
                            type="button"
                            id="facebookLogin"
                            class="social-button"
                            aria-label="Masuk dengan Facebook"
                        >

                            <!-- SVG FACEBOOK TETAP -->

                            <span>
                                Facebook
                            </span>

                        </button>

                    </div>


                    <!-- =================================================
                         19. DAFTAR
                    ================================================== -->

                    <div class="register-area">

                        <span>
                            Belum punya akun?
                        </span>

                        <a
                            href="daftar.html"
                            id="registerButton"
                            aria-label="Daftar akun baru"
                        >
                            Daftar sekarang
                        </a>

                    </div>

                </div>

            </section>

        </main>


        <!-- =================================================
             20. FOOTER
        ================================================== -->

        <footer>

            <p>
                © 2026 AKU BISA. Semua hak dilindungi.
            </p>

        </footer>

    </div>

<script>

    /* =====================================================
       AKU BISA
       LOGIN PAGE
       VANILLA JAVASCRIPT
    ====================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            "use strict";

            const users = [
                {
                    username: "admin",
                    email: "admin@akubisa.com",
                    password: "Admin123",
                    role: "admin"
                },
                {
                    username: "ivan",
                    email: "ivan@akubisa.com",
                    password: "User123",
                    role: "user"
                }
            ];


            /* =================================================
               01. MENGAMBIL ELEMENT HTML
            ================================================== */

            const loginForm =
                document.getElementById("loginForm");

            const usernameInput =
                document.getElementById("username");

            const passwordInput =
                document.getElementById("password");

            const togglePassword =
                document.getElementById("togglePassword");

            const forgotPassword =
                document.getElementById("forgotPassword");

            const googleLogin =
                document.getElementById("googleLogin");

            const facebookLogin =
                document.getElementById("facebookLogin");

            const registerButton =
                document.getElementById("registerButton");

            const rememberMe =
                document.getElementById("rememberMe");

            const usernameError =
                document.getElementById("usernameError");

            const passwordError =
                document.getElementById("passwordError");

            const formMessage =
                document.getElementById("formMessage");


            /* =================================================
               02. PEMERIKSAAN ELEMENT

               Mencegah JavaScript error jika ada element
               yang belum tersedia.
            ================================================== */

            if (
                !loginForm ||
                !usernameInput ||
                !passwordInput ||
                !togglePassword ||
                !forgotPassword ||
                !googleLogin ||
                !facebookLogin ||
                !registerButton ||
                !usernameError ||
                !passwordError ||
                !formMessage
            ) {

                console.error(
                    "AKU BISA: Element HTML yang diperlukan tidak ditemukan."
                );

                return;
            }


            /* =================================================
               03. FUNGSI BANTUAN
            ================================================== */

            function clearMessages() {

                usernameError.textContent = "";
                usernameError.classList.remove("show");

                passwordError.textContent = "";
                passwordError.classList.remove("show");

                formMessage.textContent = "";

                formMessage.className =
                    "form-message";
            }


            /* =================================================
               PESAN INFORMASI
            ================================================== */

            function showInfoMessage(message) {

                formMessage.textContent =
                    message;

                formMessage.className =
                    "form-message info";
            }


            /* =================================================
               PESAN SUKSES
            ================================================== */

            function showSuccessMessage(message) {

                formMessage.textContent =
                    message;

                formMessage.className =
                    "form-message success";
            }


            /* =================================================
               PESAN ERROR FORM
            ================================================== */

            function showErrorMessage(message) {

                formMessage.textContent =
                    message;

                formMessage.className =
                    "form-message error";
            }


            /* =================================================
               04. SHOW / HIDE PASSWORD
            ================================================== */

            togglePassword.addEventListener(
                "click",
                function () {

                    const isPassword =
                        passwordInput.type === "password";


                    if (isPassword) {

                        passwordInput.type =
                            "text";

                        togglePassword.classList.add(
                            "visible"
                        );

                        togglePassword.setAttribute(
                            "aria-label",
                            "Sembunyikan password"
                        );

                        togglePassword.setAttribute(
                            "aria-pressed",
                            "true"
                        );

                    } else {

                        passwordInput.type =
                            "password";

                        togglePassword.classList.remove(
                            "visible"
                        );

                        togglePassword.setAttribute(
                            "aria-label",
                            "Tampilkan password"
                        );

                        togglePassword.setAttribute(
                            "aria-pressed",
                            "false"
                        );

                    }

                }
            );


            /* =================================================
               05. VALIDASI USERNAME SAAT MENGETIK
            ================================================== */

            usernameInput.addEventListener(
                "input",
                function () {

                    if (
                        usernameInput.value.trim() !== ""
                    ) {

                        usernameError.textContent = "";

                        usernameError.classList.remove(
                            "show"
                        );

                    }

                }
            );


            /* =================================================
               06. VALIDASI PASSWORD SAAT MENGETIK

               UNTUK LOGIN:
               Hanya memeriksa apakah password kosong.

               TIDAK menggunakan validasi:
               - minimal 8 karakter
               - huruf besar
               - huruf kecil
               - angka
               - simbol
            ================================================== */

            passwordInput.addEventListener(
                "input",
                function () {

                    if (
                        passwordInput.value !== ""
                    ) {

                        passwordError.textContent = "";

                        passwordError.classList.remove(
                            "show"
                        );

                    }

                }
            );


            /* =================================================
               07. PROSES LOGIN
            ================================================== */

            loginForm.addEventListener(
                "submit",
                function (event) {

                    /* -----------------------------------------
                       Mencegah halaman melakukan refresh
                    ------------------------------------------ */

                    event.preventDefault();


                    /* -----------------------------------------
                       Bersihkan pesan sebelumnya
                    ------------------------------------------ */

                    clearMessages();


                    /* -----------------------------------------
                       Ambil data dari form

                       Username boleh berupa:
                       - Email
                       - Username

                       Password TIDAK di-trim agar karakter
                       password tetap persis seperti input user.
                    ------------------------------------------ */

                    const username =
                        usernameInput.value.trim();

                    const password =
                        passwordInput.value;


                    /* -----------------------------------------
                       Status validasi
                    ------------------------------------------ */

                    let isValid = true;


                    /* =========================================
                       VALIDASI EMAIL / USERNAME
                    ========================================== */

                    if (username === "") {

                        usernameError.textContent =
                            "Silakan masukkan email atau username.";

                        usernameError.classList.add(
                            "show"
                        );

                        isValid = false;

                    }


                    /* =========================================
                       VALIDASI PASSWORD
                    ========================================== */

                    if (password === "") {

                        passwordError.textContent =
                            "Password wajib diisi.";

                        passwordError.classList.add(
                            "show"
                        );

                        isValid = false;

                    }


                    /* =========================================
                       JIKA VALIDASI GAGAL
                    ========================================== */

                    if (!isValid) {

                        if (username === "") {

                            usernameInput.focus();

                        } else if (password === "") {

                            passwordInput.focus();

                        }

                        return;
                    }


                    /* =========================================
                       CARI ACCOUNT
                    ========================================== */

                    const account =
                        users.find(function (user) {

                            return (
                                (
                                    user.username.toLowerCase() ===
                                    username.toLowerCase()
                                )
                                ||
                                (
                                    user.email.toLowerCase() ===
                                    username.toLowerCase()
                                )
                            )
                            &&
                            user.password === password;

                        });


                    /* =========================================
                       JIKA ACCOUNT TIDAK DITEMUKAN
                    ========================================== */

                    if (!account) {

                        showErrorMessage(
                            "Email/username atau password salah."
                        );

                        passwordInput.focus();

                        return;
                    }


                    /* =========================================
                       BUAT SESSION LOGIN
                    ========================================== */

                    const loginSession = {

                        username:
                            account.username,

                        email:
                            account.email,

                        role:
                            account.role

                    };


                    /* =========================================
                       REMEMBER ME

                       Jika dicentang:
                       localStorage

                       Jika tidak:
                       sessionStorage
                    ========================================== */

                    if (
                        rememberMe &&
                        rememberMe.checked
                    ) {

                        localStorage.setItem(
                            "akuBisaUser",
                            JSON.stringify(loginSession)
                        );

                    } else {

                        sessionStorage.setItem(
                            "akuBisaUser",
                            JSON.stringify(loginSession)
                        );

                    }


                    /* =========================================
                       LOGIN BERHASIL
                    ========================================== */

                    showSuccessMessage(
                        "Login berhasil. Mengarahkan ke dashboard..."
                    );


                    /* =========================================
                       REDIRECT BERDASARKAN ROLE
                    ========================================== */

                    setTimeout(
                        function () {

                            if (account.role === "admin") {

                                window.location.href =
                                    "dasboard-adm.html";

                            }

                            else if (account.role === "user") {

                                window.location.href =
                                    "dasboard-user.html";

                            }

                        },
                        500
                    );

                }
            );


            /* =================================================
               08. LOGIN GOOGLE
            ================================================== */

            googleLogin.addEventListener(
                "click",
                function () {

                    clearMessages();

                    showInfoMessage(
                        "Login dengan Google belum terhubung."
                    );

                }
            );


            /* =================================================
               09. LOGIN FACEBOOK
            ================================================== */

            facebookLogin.addEventListener(
                "click",
                function () {

                    clearMessages();

                    showInfoMessage(
                        "Login dengan Facebook belum terhubung."
                    );

                }
            );


            /* =================================================
               10. LUPA PASSWORD
            ================================================== */

            forgotPassword.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    window.location.href =
                        "lupa-password.html";

                }
            );


            /* =================================================
               11. REGISTER
            ================================================== */

            registerButton.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    window.location.href =
                        "register.html";

                }
            );

        }
    );

</script>
</body>

</html>
